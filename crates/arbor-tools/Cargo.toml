[package]
name = "arbor-tools"
description = "Agent tools for the Planner and Scaffolder, confined to the Session worktree."
version.workspace = true
edition.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
arbor-config = { path = "../arbor-config" }
arbor-llm = { path = "../arbor-llm" }
globset = "0.4"
ignore = "0.4"
regex = "1"
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
