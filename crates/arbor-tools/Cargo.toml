[package]
name = "arbor-tools"
description = "Agent tools for the Planner and Scaffolder, confined to the Session worktree."
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
arbor-config.workspace = true
arbor-llm.workspace = true
globset = "0.4"
ignore = "0.4"
regex = "1"
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
shell-words = "1"
tokio = { version = "1", features = ["process", "time"] }
which = "8"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
