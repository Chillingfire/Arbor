[package]
name = "arbor-prompts"
description = "Per-Tier prompt templates and Conventions loading."
version.workspace = true
edition.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
arbor-config.workspace = true
arbor-core.workspace = true
arbor-llm.workspace = true
minijinja = { version = "3", features = ["serde"] }
serde.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
