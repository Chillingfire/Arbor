[package]
name = "arbor"
description = "A TUI harness that splits programming work across Planner, Scaffolder, and Writer LLM tiers."
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
readme = "../../README.md"

[lints]
workspace = true

[dependencies]
arbor-config.workspace = true
arbor-core.workspace = true
arbor-git.workspace = true
arbor-llm.workspace = true
arbor-prompts.workspace = true
arbor-session.workspace = true
arbor-tiers.workspace = true
arbor-tui.workspace = true
ratatui = "0.30.2"
tokio = { version = "1", features = ["rt", "macros", "sync"] }
toml = "0.9"

[dev-dependencies]
arbor-tools.workspace = true
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
